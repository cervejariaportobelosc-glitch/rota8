<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync Firebase — Rota 8</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#1a0f08;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
h1{color:#c49a2b;font-size:28px;letter-spacing:2px;margin-bottom:8px}
.sub{color:#64748b;font-size:14px;margin-bottom:32px;font-style:italic}
.card{background:rgba(44,24,16,0.8);border:1px solid rgba(196,154,43,0.3);border-radius:16px;padding:32px;max-width:480px;width:100%}
.drop-area{border:2px dashed rgba(196,154,43,0.4);border-radius:12px;padding:32px 20px;cursor:pointer;transition:border-color 0.2s;margin-bottom:24px}
.drop-area:hover{border-color:#c49a2b}
.icon{font-size:40px;color:#c49a2b;margin-bottom:12px}
.drop-area p{color:#94a3b8;font-size:14px}
.drop-area p strong{color:#c49a2b}
input[type=file]{display:none}
.btn-upload{width:100%;padding:16px;background:#c49a2b;color:#1a0f08;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:opacity 0.2s}
.btn-upload:hover{opacity:0.85}
.btn-upload:disabled{opacity:0.4;cursor:not-allowed}
.status{margin-top:20px;padding:14px 20px;border-radius:10px;font-size:15px;display:none}
.ok{background:rgba(34,197,94,0.15);border:1px solid #22c55e;color:#22c55e}
.err{background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#ef4444}
.info{background:rgba(196,154,43,0.15);border:1px solid #c49a2b;color:#c49a2b}
.preview{margin-top:16px;text-align:left;background:rgba(0,0,0,0.3);border-radius:8px;padding:12px;font-size:13px;color:#94a3b8;display:none}
</style>
</head>
<body>
<h1>🍺 ROTA 8</h1>
<p class="sub">Sincronização com Firebase</p>
<div class="card">
    <div class="drop-area" onclick="document.getElementById('fileInput').click()">
        <div class="icon">📁</div>
        <p>Clique para selecionar o arquivo<br><strong>backup_rota8.json</strong></p>
    </div>
    <input type="file" id="fileInput" accept=".json" onchange="carregarArquivo(event)">
    <div id="preview" class="preview"></div>
    <button class="btn-upload" id="btnEnviar" onclick="enviarFirebase()" disabled>
        📤 ENVIAR PARA O FIREBASE
    </button>
    <div id="status" class="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
firebase.initializeApp({
    apiKey:'AIzaSyDbKpt_M5ZYC9d_IPGZ3BvTe5SWJshnvWc',
    authDomain:'rota-8-cervejaria.firebaseapp.com',
    databaseURL:'https://rota-8-cervejaria-default-rtdb.firebaseio.com',
    projectId:'rota-8-cervejaria',
    storageBucket:'rota-8-cervejaria.firebasestorage.app',
    messagingSenderId:'880332225524',
    appId:'1:880332225524:web:7bf67c803fb5b8377457a1'
});
var db=firebase.database();
var dadosCarregados=null;

function mostrarStatus(msg,tipo){
    var s=document.getElementById('status');
    s.style.display='block';s.className='status '+tipo;s.innerHTML=msg;
}

function carregarArquivo(event){
    var file=event.target.files[0];if(!file)return;
    mostrarStatus('Lendo arquivo...','info');
    var reader=new FileReader();
    reader.onload=function(e){
        try{
            dadosCarregados=JSON.parse(e.target.result);
            var fichas=dadosCarregados.fichasTecnicas||[];
            var preview=document.getElementById('preview');
            preview.style.display='block';
            preview.innerHTML='<strong style="color:#c49a2b">Fichas: '+fichas.length+'</strong><br>'
                +fichas.map(function(f){return '• '+f.lote+' — '+f.estilo;}).join('<br>');
            document.getElementById('btnEnviar').disabled=false;
            mostrarStatus('Arquivo carregado! '+fichas.length+' ficha(s). Clique em Enviar.','ok');
        }catch(err){mostrarStatus('Arquivo inválido: '+err.message,'err');}
    };
    reader.readAsText(file);
}

function enviarFirebase(){
    if(!dadosCarregados)return;
    document.getElementById('btnEnviar').disabled=true;
    mostrarStatus('Enviando para o Firebase...','info');
    db.ref('erp/rota8cervejaria/dados').set(dadosCarregados)
        .then(function(){
            var fichas=dadosCarregados.fichasTecnicas||[];
            mostrarStatus(fichas.length+' ficha(s) sincronizada(s) com sucesso! Teste o QR Code.','ok');
            document.getElementById('btnEnviar').disabled=false;
        })
        .catch(function(err){
            mostrarStatus('Erro: '+err.message,'err');
            document.getElementById('btnEnviar').disabled=false;
        });
}
</script>
</body>
</html>
